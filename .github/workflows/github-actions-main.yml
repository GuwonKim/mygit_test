name: SSH & nginx.conf Transfer Test

on:
  workflow_dispatch:   # 수동 실행

jobs:
  ssh-nginx-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 레포 체크아웃 (nginx.conf 가져오기 위해 필수)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 시크릿 존재 여부 확인
      - name: Check secrets existence
        run: |
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then echo "SERVER_HOST ❌"; else echo "SERVER_HOST ✅"; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then echo "SERVER_USER ❌"; else echo "SERVER_USER ✅"; fi
          if [ -z "${{ secrets.SERVER_SSH_KEY }}" ]; then echo "SERVER_SSH_KEY ❌"; else echo "SERVER_SSH_KEY ✅"; fi

      # 3️⃣ SSH 설정
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Debug SSH key
        run: |
          echo "==== SSH KEY HEADER ===="
          head -n 2 ~/.ssh/id_rsa
          echo "==== SSH KEY FOOTER ===="
          tail -n 2 ~/.ssh/id_rsa
    
      # 4️⃣ nginx.conf 파일 존재 확인
      - name: Check nginx.conf exists
        run: |
          ls -l nginx.conf

      # 5️⃣ nginx.conf 서버로 전송
      - name: Upload nginx.conf to server
        run: |
          scp nginx.conf \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/nginx.conf.test

      # 6️⃣ 서버에서 파일 확인
      - name: Verify nginx.conf on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo '📁 File info:';
            ls -l /tmp/nginx.conf.test;
            echo '📄 First 20 lines:';
            head -n 20 /tmp/nginx.conf.test
          "
