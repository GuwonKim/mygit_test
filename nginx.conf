server {
    listen 80;
    server_name viper.breezeway.team;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name viper.breezeway.team;

    ssl_certificate /etc/ssl/certs/_wildcard_.breezeway.team_202509021A726.all.crt.pem;
    ssl_certificate_key /etc/ssl/private/_wildcard_.breezeway.team_202509021A726.key.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
